name: Auto release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag version and dispatch release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check target is current main
        id: current
        run: |
          git fetch origin main
          TARGET_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Tested commit $TARGET_SHA is not current main ($MAIN_SHA); skipping."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Info.plist version
        if: steps.current.outputs.current == 'true'
        id: version
        run: |
          VERSION="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CFBundleShortVersionString must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Oriel version: $VERSION"

      - name: Check published release
        if: steps.current.outputs.current == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: steps.release.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_SHA" != "$TARGET_SHA" ]]; then
              echo "::error::Tag $TAG already exists at $TAG_SHA, not at the tested commit $TARGET_SHA."
              exit 1
            fi
            echo "Tag $TAG already points at the tested commit."
          else
            git config user.name "oriel-release-bot"
            git config user.email "oriel-release-bot@users.noreply.github.com"
            git tag -a "$TAG" -m "Oriel ${TAG#v}"
            git push origin "$TAG"
          fi

      - name: Dispatch release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched Release for $TAG."
