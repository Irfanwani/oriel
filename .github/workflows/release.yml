name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read and verify version
        if: steps.existing.outputs.exists == 'false'
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must run from a v* tag, got $GITHUB_REF_NAME"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"

          if [[ "$VERSION" != "$PLIST_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing Oriel $VERSION (build $BUILD_NUMBER) from $GITHUB_REF_NAME"

      - name: Package universal app
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: ./scripts/package.sh

      - name: Verify package
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          codesign --verify --deep --strict build/Oriel.app
          lipo -info build/Oriel.app/Contents/MacOS/Oriel
          hdiutil verify "dist/Oriel-$VERSION.dmg"
          cat "dist/Oriel-$VERSION.dmg.sha256"

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Oriel ${VERSION}" \
            --generate-notes \
            "dist/Oriel-${VERSION}.dmg" \
            "dist/Oriel-${VERSION}.dmg.sha256"

      - name: Notify Homebrew tap
        if: steps.existing.outputs.exists == 'false'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "TAP_TOKEN is not configured; the tap's hourly updater will mirror this release."
            exit 0
          fi

          if ! curl -fsS -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Irfanwani/homebrew-oriel/dispatches" \
            -d "{\"event_type\":\"oriel-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"; then
            echo "::warning::Could not dispatch the tap updater; the hourly updater will retry."
          fi
